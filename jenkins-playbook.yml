---
- name: Jenkins CI/CD Pipeline for Microservices
  hosts: remote
  become: true

  vars:
    app_dir: "/home/{{ ansible_user }}/devops-app"
    backend_repo: "https://github.com/TheSt1x/backend.git"
    frontend_repo: "https://github.com/TheSt1x/frontend.git"
    devops_repo: "https://github.com/TheSt1x/DevOps.git"
    repo_branch: "main"

  tasks:
    - name: Install prerequisites
      apt:
        name: [ca-certificates, curl, gnupg, git, python3-apt]
        state: present
        update_cache: yes
      tags: [prepare]

    - name: Create directory for Docker GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      tags: [prepare]

    - name: Add Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg
      tags: [prepare]

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
      tags: [prepare]

    - name: Install Docker and Compose plugin
      apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: present
        update_cache: yes
      tags: [prepare]

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes
      tags: [prepare]

    - name: Add remote user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
      tags: [prepare]

    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'
      tags: [prepare]

    - name: Clone repositories
      git:
        repo: "{{ item.repo }}"
        dest: "{{ app_dir }}/{{ item.dir }}"
        version: "{{ repo_branch }}"
        force: yes
      loop:
        - { repo: "{{ backend_repo }}", dir: "backend" }
        - { repo: "{{ frontend_repo }}", dir: "frontend" }
        - { repo: "{{ devops_repo }}", dir: "DevOps" }
      tags: [prepare]


    - name: Start microservices via docker compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}/DevOps"
        state: present
        build: always
      environment:
        BUILDX_BAKE_ENTITLEMENTS_FS: "0"
      tags: [deploy]
